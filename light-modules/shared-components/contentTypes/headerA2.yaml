datasource:
  $type: jcrContentTypeDatasource
  workspace: headerA2s
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:headerA2
  properties:
    - name: title
    - name: description
      type: richText
    - name: image
      type: asset
    - name: headerType
      defaultValue: a2
      options:
        - name: a1
          value: a1
          label: A1
        - name: a2
          value: a2
          label: A2
        - name: a3
          value: a3
          label: A3
        - name: a4
          value: a4
          label: A4
    - name: headerBgColor
      defaultValue: default
      options:
        - name: default
          value: default
          label: Default
        - name: redGradient
          value: redGradient
          label: Red Gradient
    - name: ctaChooser
      type: ctaChooser
    - name: overlayImage
      type: asset

  subModels:
    - name: ctaChooser
      properties:
        - name: label
        - name: isExternal
          type: boolean
        - name: href
