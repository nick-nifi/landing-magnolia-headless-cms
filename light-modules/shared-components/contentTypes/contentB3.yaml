datasource:
  $type: jcrContentTypeDatasource
  workspace: contentB3
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:contentB3
  properties:
    - name: title
    - name: description
    - name: itemText
      type: richText
    - name: ctaChooser
      type: ctaChooser
    - name: divider
      type: boolean
      defaultValue: false

  subModels:
    - name: ctaChooser
      properties:
        - name: label
        - name: isExternal
          type: boolean
        - name: href

