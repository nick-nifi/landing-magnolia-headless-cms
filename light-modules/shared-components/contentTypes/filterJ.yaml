datasource:
  $type: jcrContentTypeDatasource
  workspace: filterJ
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:filterJ
  properties:
    - name: label
    - name: placeholder
    - name: items
      type: filterItem
      multiple: true

  subModels:
    - name: filterItem
      label: Filter Item
      properties:
        - name: value
          label: Value

