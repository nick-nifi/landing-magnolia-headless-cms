datasource:
  $type: jcrContentTypeDatasource
  workspace: filterI
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:filterI
  properties:
    - name: heading
    - name: placeholder
    - name: locations
      type: locationItem
      multiple: true
    - name: buttonText

  subModels:
    - name: locationItem
      properties:
        - name: locationName
        - name: internalLink

