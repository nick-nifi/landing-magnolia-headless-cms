datasource:
  $type: jcrContentTypeDatasource
  workspace: research-private-wealth-management
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:research-private-wealth-management
  properties:
    - name: title
    - name: description
    - name: headerA2
      type: reference:headerA2
    - name: specialMenu
      type: reference:specialMenu
      multiple: true
    - name: featureC2List
      type: featureC2Item
    - name: filterI
      type: reference:filterI
    - name: listD3List
      type: listD3Item
    - name: featureC5List
      type: featureC5Item

  subModels:
    - name: heroListItem
      properties:
        - name: title
        - name: heroItems
          type: reference:heroA1
          multiple: true
    - name: listD3Item
      properties:
        - name: title
        - name: d3Items
          type: reference:listD3
          multiple: true
    - name: featureC5Item
      properties:
        - name: title
        - name: c5Items
          type: reference:featureC5
          multiple: true
    - name: featureC2Item
      properties:
        - name: title
        - name: c2Items
          type: reference:featureC2
          multiple: true

