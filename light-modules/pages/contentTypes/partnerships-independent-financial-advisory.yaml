datasource:
  $type: jcrContentTypeDatasource
  workspace: partnerships-independent-financial-advisory
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:partnerships-independent-financial-advisory
  properties:
    - name: title
    - name: description
    - name: heroList
      type: heroListItem
    - name: accordionE2List
      type: accordionE2Item
    - name: contentB3List
      type: reference:contentB3
    - name: contentC3List
      type: contentC3Item
    - name: featureC2List
      type: featureC2Item

  subModels:
    - name: heroListItem
      properties:
        - name: title
        - name: heroItems
          type: reference:heroA1
          multiple: true
    - name: accordionE2Item
      properties:
        - name: title
        - name: description
          type: richText
        - name: e2Items
          type: reference:accordionE2
          multiple: true
    - name: contentB3Item
      properties:
        - name: title
        - name: b3Items
          type: reference:contentB3
          multiple: true
    - name: contentC3Item
      properties:
        - name: title
        - name: c3Items
          type: reference:contentC3
          multiple: true
    - name: featureC2Item
      properties:
        - name: title
        - name: c2Items
          type: reference:featureC2
          multiple: true

