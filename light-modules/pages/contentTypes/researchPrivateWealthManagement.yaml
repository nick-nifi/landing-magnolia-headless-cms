datasource:
  $type: jcrContentTypeDatasource
  workspace: researchPrivateWealthManagements
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:researchPrivateWealthManagement
  properties:
    - name: title
    - name: description
    - name: headerA2
      type: reference:headerA2
    - name: tabLinks
      type: tabLink
    - name: featureC2List
      type: featureC2Item
    - name: selectUobkhResearch
      type: reference:selectUobkhResearch
      multiple: true
    - name: listD3List
      type: listD3Item
    - name: featureC5List
      type: featureC5Item

  subModels:
    - name: featureC5Item
      properties:
        - name: title
        - name: c5Items
          type: reference:featureC5
          multiple: true
    - name: listD3Item
      properties:
        - name: title
        - name: listD3Items
          type: reference:listD3
          multiple: true
    - name: featureC2Item
      properties:
        - name: title
        - name: c2Items
          type: reference:featureC2
          multiple: true
