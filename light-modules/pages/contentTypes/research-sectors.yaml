datasource:
  $type: jcrContentTypeDatasource
  workspace: research-sectors
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:research-sectors
  properties:
    - name: title
    - name: description
    - name: heroList
      type: heroListItem
    - name: specialMenu
      type: reference:specialMenu
    - name: featureC2List
      type: featureC2Item
    - name: filterI
      type: reference:filterI
    - name: contentB3List
      type: contentB3Item
    - name: featureC5List
      type: featureC5Item

  subModels:
    - name: heroListItem
      properties:
        - name: title
        - name: heroItems
          type: reference:heroA1
          multiple: true
    - name: contentB3Item
      properties:
        - name: title
        - name: b3Items
          type: reference:contentB3
          multiple: true
    - name: featureC5Item
      properties:
        - name: title
        - name: c5Items
          type: reference:featureC5
          multiple: true
    - name: featureC2Item
      properties:
        - name: title
        - name: c2Items
          type: reference:featureC2
          multiple: true

