datasource:
  $type: jcrContentTypeDatasource
  workspace: services-private-wealth-management
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:services-private-wealth-management
  properties:
    - name: title
    - name: description
    - name: heroList
      type: heroListItem
    - name: featureC11List
      type: featureC11Item
    - name: listD1List1
      type: listD1Item
    - name: listD1List2
      type: listD1Item
    - name: stepsKList
      type: stepsKItem
    - name: accordionE2List
      type: accordionE2Item
    - name: logoMList
      type: logoMItem
    - name: contentB1
      type: reference:contentB1
    - name: contentB2
      type: reference:contentB2
    - name: contentC4List
      type: contentC4Item
    - name: contentB7
      type: reference:contentB7
    - name: contentC3List
      type: contentC3Item
    - name: featureC5List
      type: featureC5Item
    - name: featureC2List
      type: featureC2Item

  subModels:
    - name: heroListItem
      properties:
        - name: title
        - name: heroItems
          type: reference:heroA1
          multiple: true
    - name: featureC11Item
      properties:
        - name: title
        - name: c11Items
          type: reference:featureC11
          multiple: true
    - name: listD1Item
      properties:
        - name: title
        - name: d1Items
          type: reference:listD1
          multiple: true
        - name: ctaChooser
          type: ctaChooser
    - name: stepsKItem
      properties:
        - name: title
        - name: kSteps
          type: reference:stepsK
          multiple: true
        - name: ctaChooser
          type: ctaChooser
    - name: accordionE2Item
      properties:
        - name: title
        - name: description
          type: richText
        - name: e2Items
          type: reference:accordionE2
          multiple: true
    - name: logoMItem
      properties:
        - name: title
        - name: mItems
          type: reference:logoM
          multiple: true
    - name: contentC4Item
      properties:
        - name: title
        - name: c4Items
          type: reference:contentC4
          multiple: true
    - name: contentC3Item
      properties:
        - name: title
        - name: c3Items
          type: reference:contentC3
          multiple: true
    - name: featureC5Item
      properties:
        - name: title
        - name: c5Items
          type: reference:featureC5
          multiple: true
    - name: featureC2Item
      properties:
        - name: title
        - name: c2Items
          type: reference:featureC2
          multiple: true
    - name: ctaChooser
      properties:
        - name: field
        - name: ctaText
        - name: ctaLink
          type: ctaLink
    - name: ctaLink
      properties:
        - name: field
        - name: internalLink
        - name: externalLink

