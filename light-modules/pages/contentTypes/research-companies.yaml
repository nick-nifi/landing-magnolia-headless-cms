datasource:
  $type: jcrContentTypeDatasource
  workspace: research-companies
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:research-companies
  properties:
    - name: title
    - name: description
    - name: headerA2
      type: reference:headerA2
    - name: specialMenu
      type: specialMenus
      multiple: true
    - name: featureC2List
      type: featureC2Item
    - name: filterI
      type: reference:filterI
    - name: contentC6List
      type: contentC6Item
    - name: featureC5List
      type: featureC5Item

  subModels:
    - name: heroListItem
      properties:
        - name: title
        - name: heroItems
          type: reference:heroA1
          multiple: true
    - name: contentC6Item
      properties:
        - name: title
        - name: c6Items
          type: reference:contentC6
          multiple: true
        - name: ctaChooser
          type: ctaChooser
    - name: featureC5Item
      properties:
        - name: title
        - name: c5Items
          type: reference:featureC5
          multiple: true
    - name: featureC2Item
      properties:
        - name: title
        - name: c2Items
          type: reference:featureC2
          multiple: true
        - name: isBackground
          type: boolean
    - name: ctaChooser
      properties:
        - name: label
        - name: isExternal
          type: boolean
        - name: href
    - name: specialMenus
      properties:
        - name: menuItems
          type: reference:specialMenu
        - name: isActive
          type: boolean
