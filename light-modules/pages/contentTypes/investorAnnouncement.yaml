datasource:
  $type: jcrContentTypeDatasource
  workspace: investorAnnouncements
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:investorAnnouncement
  properties:
    - name: title
    - name: description
      type: richText
    - name: headerA2
      type: reference:headerA2
    - name: filters
      type: filterJ
    - name: downloadListF
      type: reference:downloadListF
    - name: contentB9
      type: contentB9
  
  subModels:
      - name: filterJ
        properties:
          - name: title
          - name: filterJItems
            type: reference:filterJ
            multiple: true
      - name: contentB9
        properties:
          - name: title
          - name: image
            type: image
            multiple: true
      - name: image
        properties:
          - name: image
            type: asset
          - name: alt
