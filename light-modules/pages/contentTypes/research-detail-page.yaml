datasource:
  $type: jcrContentTypeDatasource
  workspace: research-detail-page
  namespaces:
    mt: https://www.magnolia-travel.com/jcr/1.0/mt
  autoCreate: true

model:
  nodeType: mt:research-detail-page
  properties:
    - name: title
    - name: description
    - name: header
      type: header
    - name: contentB11
      type: reference:contentB11
    - name: filterI
      type: reference:filterI

  subModels:
    - name: heroListItem
      properties:
        - name: title
        - name: heroItems
          type: reference:heroA1
          multiple: true
    - name: header
      properties:
        - name: title
        - name: description
        - name: button
          type: button
    - name: button
      properties:
        - name: label
        - name: isExternal
          type: boolean
        - name: href

