label: reportJ
form:
  properties:
    title:
      $type: textField
      label: Title
      required: true
      i18n: true
    imageChooser:
      $type: switchableField
      label: Image
      i18n: true
      field:
        $type: comboBoxField
        defaultValue: image
        required: true
        datasource:
          $type: optionListDatasource
          options:
            - name: image
              label: Internal Image
              value: image
            - name: externalImage
              label: External Image
              value: externalImage
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        - name: image
          properties:
            image:
              i18n: true
              required: false
              $type: damLinkField
              label: Internal Image Link
            imageAlt:
              i18n: true
              $type: textField
              label: Image Alt Text
        - name: externalImage
          properties:
            externalImage:
              i18n: true
              required: false
              $type: textField
              label: External Image Link
              validators:
                imageUrlValidator:
                  $type: regexpValidator
                  pattern: ^https?:\/\/(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?$
                  errorMessage: Enter a valid Image URL
            externalImageAlt:
              i18n: true
              $type: textField
              label: Image Alt Text
    overlayImageChooser:
      $type: switchableField
      label: Overlay Image (Optional)
      i18n: true
      field:
        $type: comboBoxField
        defaultValue: noOverlay
        required: true
        datasource:
          $type: optionListDatasource
          options:
            - name: noOverlay
              label: No Overlay Image
              value: noOverlay
            - name: image
              label: Internal Image
              value: image
            - name: externalImage
              label: External Image
              value: externalImage
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        - name: noOverlay
          properties: {}
        - name: image
          properties:
            image:
              i18n: true
              required: false
              $type: damLinkField
              label: Internal Image Link
            imageAlt:
              i18n: true
              $type: textField
              label: Image Alt Text
        - name: externalImage
          properties:
            externalImage:
              i18n: true
              required: false
              $type: textField
              label: External Image Link
              validators:
                imageUrlValidator:
                  $type: regexpValidator
                  pattern: ^https?:\/\/(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?$
                  errorMessage: Enter a valid Image URL
            externalImageAlt:
              i18n: true
              $type: textField
              label: Image Alt Text
    viewButton:
      $type: switchableField
      label: View Button
      i18n: true
      field:
        $type: comboBoxField
        defaultValue: noButton
        required: true
        datasource:
          $type: optionListDatasource
          options:
            - name: noButton
              label: No Button
              value: noButton
            - name: withButton
              label: With Button
              value: withButton
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        - name: noButton
          properties: {}
        - name: withButton
          properties:
            buttonText:
              $type: textField
              required: true
              label: Button Text
              i18n: true
              defaultValue: View
            buttonLink:
              $type: switchableField
              i18n: true
              label: Button Link
              field:
                $type: comboBoxField
                defaultValue: fileLink
                required: true
                datasource:
                  $type: optionListDatasource
                  options:
                    - name: fileLink
                      label: File Link
                      value: fileLink
                    - name: internalPageLink
                      label: Internal Page Link
                      value: internalPageLink
                    - name: externalPageLink
                      label: External Page Link
                      value: externalPageLink
              itemProvider:
                $type: jcrChildNodeProvider
              forms:
                - name: fileLink
                  properties:
                    file:
                      i18n: true
                      required: true
                      $type: damLinkField
                      label: File
                      converterClass: info.magnolia.ui.editor.converter.JcrNodeToPathConverter
                - name: internalPageLink
                  properties:
                    internalLink:
                      i18n: true
                      required: true
                      $type: pageLinkField
                      label: Internal Page Link
                      converterClass: info.magnolia.ui.editor.converter.JcrNodeToPathConverter
                - name: externalPageLink
                  properties:
                    externalLink:
                      i18n: true
                      required: true
                      $type: textField
                      label: External Page Link
                      validators:
                        urlValidator:
                          $type: regexpValidator
                          pattern: ^https?:\/\/(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?$
                          errorMessage: Please enter a valid URL

