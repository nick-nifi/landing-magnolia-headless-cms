label: contentB9
form:
  properties:
    title:
      $type: textField
      label: Title
      required: true
      i18n: true
    charts:
      $type: jcrMultiField
      label: Charts
      required: true
      field:
        $type: compositeField
        label: Chart
        properties:
          chartTitle:
            $type: textField
            label: Chart Title
            required: true
            i18n: true
          mainValue:
            $type: textField
            label: Main Value
            required: true
            i18n: true
          subContent:
            $type: textField
            label: Sub Content (Description)
            required: false
            i18n: true
          timePeriod:
            $type: textField
            label: Time Period
            required: false
            i18n: true
          chartImageChooser:
            $type: switchableField
            label: Chart Image
            i18n: true
            field:
              $type: comboBoxField
              defaultValue: image
              required: true
              datasource:
                $type: optionListDatasource
                options:
                  - name: image
                    label: Internal Image
                    value: image
                  - name: externalImage
                    label: External Image
                    value: externalImage
            itemProvider:
              $type: jcrChildNodeProvider
            forms:
              - name: image
                properties:
                  chartImage:
                    i18n: true
                    required: true
                    $type: damLinkField
                    label: Chart Image Link
                  chartImageAlt:
                    i18n: true
                    $type: textField
                    label: Chart Image Alt Text
              - name: externalImage
                properties:
                  externalChartImage:
                    i18n: true
                    required: true
                    $type: textField
                    label: External Chart Image Link
                    validators:
                      imageUrlValidator:
                        $type: regexpValidator
                        pattern: ^https?:\/\/(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?$
                        errorMessage: Enter a valid Image URL
                  externalChartImageAlt:
                    i18n: true
                    $type: textField
                    label: Chart Image Alt Text
    customClass:
      $type: textField
      label: Custom CSS Class
      required: false

