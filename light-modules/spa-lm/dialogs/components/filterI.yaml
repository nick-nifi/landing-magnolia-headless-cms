label: filterI
form:
  properties:
    heading:
      $type: textField
      label: Heading
      required: true
      i18n: true
      defaultValue: View all UOBKH research

    placeholder:
      $type: textField
      label: Placeholder Text
      required: true
      i18n: true
      defaultValue: Select location

    locations:
      $type: jcrMultiField
      label: Locations
      itemProvider:
        $type: jcrChildNodeProvider
      field:
        $type: compositeField
        properties:
          locationName:
            $type: textField
            label: Location Name
            required: true
            i18n: true
          internalLink:
            $type: pageLinkField
            label: Internal Page Link
            required: true
            i18n: true
            converterClass: info.magnolia.ui.editor.converter.JcrNodeToPathConverter

    buttonText:
      $type: textField
      label: Button Text
      required: true
      i18n: true
      defaultValue: Go
