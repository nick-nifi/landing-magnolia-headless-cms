label: filterI
form:
  properties:
    heading:
      $type: textField
      label: Heading
      required: true
      i18n: true
      defaultValue: View all UOBKH research

    placeholder:
      $type: textField
      label: Placeholder Text
      required: true
      i18n: true
      defaultValue: Select location

    locations:
      $type: jcrMultiField
      label: Locations
      itemProvider:
        $type: jcrChildNodeProvider
      field:
        $type: compositeField
        properties:
          locationName:
            $type: textField
            label: Location Name
            required: true
            i18n: true
          locationLink:
            $type: switchableField
            label: Location Link (Optional)
            i18n: true
            field:
              $type: comboBoxField
              label: Link Type
              required: true
              defaultValue: noLink
              datasource:
                $type: optionListDatasource
                options:
                  - name: noLink
                    label: No Link
                    value: noLink
                  - name: internalPageLink
                    label: Internal Page Link
                    value: internalPageLink
                  - name: externalPageLink
                    label: External Page Link
                    value: externalPageLink
            itemProvider:
              $type: jcrChildNodeProvider
            forms:
              - name: noLink
                properties: {}
              - name: internalPageLink
                properties:
                  internalLink:
                    $type: pageLinkField
                    label: Internal Page Link
                    required: true
                    i18n: true
                    converterClass: info.magnolia.ui.editor.converter.JcrNodeToPathConverter
              - name: externalPageLink
                properties:
                  externalLink:
                    $type: textField
                    label: External Page Link
                    required: true
                    i18n: true
                    validators:
                      urlValidator:
                        $type: regexpValidator
                        pattern: ^https?:\/\/(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?$
                        errorMessage: Please enter a valid URL

    buttonText:
      $type: textField
      label: Button Text
      required: true
      i18n: true
      defaultValue: Go

    buttonLink:
      $type: switchableField
      label: Button Link
      i18n: true
      field:
        $type: comboBoxField
        label: Link Type
        required: true
        defaultValue: internalPageLink
        datasource:
          $type: optionListDatasource
          options:
            - name: internalPageLink
              label: Internal Page Link
              value: internalPageLink
            - name: externalPageLink
              label: External Page Link
              value: externalPageLink
      itemProvider:
        $type: jcrChildNodeProvider
      forms:
        - name: internalPageLink
          properties:
            internalLink:
              $type: pageLinkField
              label: Internal Page Link
              required: true
              i18n: true
              converterClass: info.magnolia.ui.editor.converter.JcrNodeToPathConverter
        - name: externalPageLink
          properties:
            externalLink:
              $type: textField
              label: External Page Link
              required: true
              i18n: true
              validators:
                urlValidator:
                  $type: regexpValidator
                  pattern: ^https?:\/\/(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(?:\/[^\s]*)?$
                  errorMessage: Please enter a valid URL
