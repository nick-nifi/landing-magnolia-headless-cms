label: gridCol
form:
  properties:
    span:
      $type: switchableField
      label: Column Span
      field:
        $type: comboBoxField
        defaultValue: "1"
        required: true
        datasource:
          $type: optionListDatasource
          options:
            - name: "1"
              label: "1"
              value: "1"
            - name: "2"
              label: "2"
              value: "2"
            - name: "3"
              label: "3"
              value: "3"
            - name: "4"
              label: "4"
              value: "4"
            - name: "5"
              label: "5"
              value: "5"
            - name: "6"
              label: "6"
              value: "6"
    text:
      label: Text
      $type: richTextField
      i18n: true
      required: true
      colors: 02373F
      fontSizes: "Small/0.75rem;Default/1rem;Big/1.5rem"
