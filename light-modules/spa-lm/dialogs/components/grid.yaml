label: grid
form:
  properties:
    cols:
      $type: switchableField
      label: Columns
      field:
        $type: comboBoxField
        defaultValue: "12"
        required: true
        datasource:
          $type: optionListDatasource
          options:
            - name: "1"
              label: "1"
              value: "1"
            - name: "2"
              label: "2"
              value: "2"
            - name: "3"
              label: "3"
              value: "3"
            - name: "4"
              label: "4"
              value: "4"
            - name: "5"
              label: "5"
              value: "5"
            - name: "6"
              label: "6"
              value: "6"
            - name: "7"
              label: "7"
              value: "7"
            - name: "8"
              label: "8"
              value: "8"
            - name: "9"
              label: "9"
              value: "9"
            - name: "10"
              label: "10"
              value: "10"
            - name: "11"
              label: "11"
              value: "11"
            - name: "12"
              label: "12"
              value: "12"
    rows:
      $type: switchableField
      label: Rows
      field:
        $type: comboBoxField
        defaultValue: "1"
        required: true
        datasource:
          $type: optionListDatasource
          options:
            - name: "1"
              label: "1"
              value: "1"
            - name: "2"
              label: "2"
              value: "2"
            - name: "3"
              label: "3"
              value: "3"
            - name: "4"
              label: "4"
              value: "4"
            - name: "5"
              label: "5"
              value: "5"
            - name: "6"
              label: "6"
              value: "6"
            - name: "7"
              label: "7"
              value: "7"
            - name: "8"
              label: "8"
              value: "8"
            - name: "9"
              label: "9"
              value: "9"
            - name: "10"
              label: "10"
              value: "10"
            - name: "11"
              label: "11"
              value: "11"
            - name: "12"
              label: "12"
              value: "12"
      itemProvider:
        $type: jcrChildNodeProvider
    gutter:
      $type: textField
      label: Gutter (spacing)
      required: false
      description: Enter a number for grid gap spacing
    customCss:
      $type: textField
      label: Custom CSS Classes
      required: false
      description: Additional Tailwind CSS classes
