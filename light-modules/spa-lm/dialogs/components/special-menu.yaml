label: special-menu
form:
  properties:
    menuItems:
      $type: jcrMultiField
      label: Menu Items
      required: true
      field:
        $type: compositeField
        label: Menu Item
        properties:
          id:
            $type: textField
            label: ID
            required: true
            i18n: false
          label:
            $type: textField
            label: Label
            required: true
            i18n: true
          isActive:
            $type: checkBoxField
            label: Is Active
            required: false
          internalLink:
            i18n: true
            required: true
            $type: pageLinkField
            label: Internal Page Link
            converterClass: info.magnolia.ui.editor.converter.JcrNodeToPathConverter
    category:
      $type: textField
      label: Category (Optional)
      required: false
      i18n: false

